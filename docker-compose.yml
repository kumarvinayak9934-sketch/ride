# Safar Share — local datastores + API + Web.
# Local run contract (§13):
#   docker compose up -d postgres redis
#   docker compose exec -T postgres psql -U safar -d safar < apps/api/migrations/001_init.sql
#   cp apps/api/.env.example apps/api/.env
#   cd apps/api && go mod tidy && go test ./... && go run ./cmd/server   # :8080
#   cd apps/web && npm install && npm run dev                            # :3000
# `docker compose up --build` also works: API waits for healthy datastores.
name: safar-share

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: safar
      POSTGRES_PASSWORD: safar
      POSTGRES_DB: safar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safar -d safar"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://safar:safar@postgres:5432/safar?sslmode=disable
      REDIS_ADDR: redis:6379
      HTTP_ADDR: ":8080"
      ENV: dev
      JWT_SECRET: dev-only-change-me-0123456789abcdef
      PHONE_HASH_PEPPER: dev-pepper-change-me
      WEBHOOK_SECRET: dev-webhook-secret-change-me
      OTP_DEV_ECHO: "true"
      ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Browser talks to same origin; Next rewrites proxy /api/* -> API_BASE server-side.
      API_BASE: http://api:8080
      NEXT_PUBLIC_API_BASE: /api
    ports:
      - "3000:3000"

volumes:
  pgdata:
