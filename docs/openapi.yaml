openapi: 3.0.3
info:
  title: Safar Share API
  description: |
    India-first private-car cost-sharing carpool platform (MVP, §0–§15).

    Conventions:
    * Auth = `Authorization: Bearer <JWT>` (HS256, 24 h) issued by `POST /v1/auth/otp/verify`.
    * Errors use RFC 7807 `application/problem+json` (`type/title/status/detail`).
    * Money values are INR as JSON numbers; the pricing engine always applies
      the mandatory cost-cap clamp before min-fare (§5.3).
    * Mutating booking calls require an `Idempotency-Key` header.
    * Empty search results return `200` with `"results": []` — never 404 (§5.2).
  version: 0.1.0
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: local docker-compose
tags:
  - name: health
  - name: auth
  - name: routes
  - name: rides
  - name: bookings
  - name: payments
  - name: verification

paths:
  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Liveness/readiness with Postgres + Redis checks
      responses:
        "200":
          description: Service status (possibly degraded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOTP
      summary: Request a 6-digit login OTP
      description: Rate limited to 3 requests / 10 minutes per number (§5.1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OTPRequest" }
      responses:
        "200":
          description: OTP dispatched (in dev, echoed when OTP_DEV_ECHO=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: otp_sent }
                  dev_code: { type: string, description: dev-only echo }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }

  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOTP
      summary: Verify OTP, upsert account, issue session JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OTPVerify" }
      responses:
        "200":
          description: Session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the presented JWT (JTI blocklist, §5.1)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: logged_out }

  /v1/routes/publish:
    post:
      tags: [routes]
      operationId: publishRoute
      summary: Publish a driver corridor (route) with waypoints
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublishRouteRequest" }
      responses:
        "201":
          description: Route published
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Route" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/routes/mine:
    get:
      tags: [routes]
      operationId: listMyRoutes
      summary: List the caller's published routes
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Routes (possibly empty array)
          content:
            application/json:
              schema:
                type: object
                properties:
                  routes:
                    type: array
                    items: { $ref: "#/components/schemas/Route" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/rides/search:
    post:
      tags: [rides]
      operationId: searchRides
      summary: Corridor search with PostGIS + 0.40/0.25/0.20/0.15 ranking
      description: |
        Candidates must lie within `radius_m` (default 2000 m) of BOTH endpoints,
        in forward order, on the requested date, with free seats. Results are
        ranked by `score = 0.40·detour + 0.25·time + 0.20·rating + 0.15·price`.
        No matches ⇒ `200` with `results: []` (§5.2).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Ranked results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/Problem" }

  /v1/bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Book seats on a ride instance (idempotent)
      description: |
        Requires `Idempotency-Key`. Seat capacity is enforced under
        `SELECT … FOR UPDATE` with Redis seat locks as the fast path (§5.4);
        concurrent last-seat races yield exactly one 201 and 409s for the rest.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Booking created (PENDING_PAYMENT)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [bookings]
      operationId: listMyBookings
      summary: List the caller's bookings
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/bookings/{id}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Fetch one booking
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking (state machine §5.6)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: Illegal state transition
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/payments/webhook:
    post:
      tags: [payments]
      operationId: paymentWebhook
      summary: Provider callback (HMAC over raw body, §5.5)
      description: |
        Signature = `hex(HMAC-SHA256(secret, ts + "." + rawBody))` in
        `X-Signature`, timestamp (unix seconds) in `X-Timestamp`, freshness
        ±300 s. Replay of the last applied `event_id` ⇒ `200 duplicate`;
        events the state machine rejects ⇒ `200 ignored`. Capture posts a
        balanced double-entry `ledger_entry` pair `capture:<event_id>`.
      parameters:
        - name: X-Timestamp
          in: header
          required: true
          schema: { type: string }
        - name: X-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentEvent" }
      responses:
        "200":
          description: Applied / duplicate / already_confirmed / ignored
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [applied, duplicate, already_confirmed, ignored]
                  event_id: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /v1/payments/{id}:
    get:
      tags: [payments]
      operationId: getPaymentStatus
      summary: Poll payment status
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentStatus" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/verify/digilocker/start:
    post:
      tags: [verification]
      operationId: startDigiLocker
      summary: Begin DigiLocker KYC (consent-gated, §10)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_version]
              properties:
                consent_version:
                  type: string
                  description: Explicit purpose-limited consent version accepted by the user
                  example: "2026-01"
                purpose:
                  type: string
                  default: driver_identity_verification
      responses:
        "200":
          description: Authorize URL + PKCE state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/verify/digilocker/callback:
    post:
      tags: [verification]
      operationId: digilockerCallback
      summary: OAuth callback from DigiLocker (exchanges code, stores masked docs)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Verification progressed (state machine, 7 states)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyStatus" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/verify/status:
    get:
      tags: [verification]
      operationId: verificationStatus
      summary: Current verification state for the caller
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Verification status (never raw document numbers)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerifyStatus" }
        "401": { $ref: "#/components/responses/Problem" }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: RFC 7807 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Validation Failed }
        status: { type: integer, example: 400 }
        detail: { type: string }

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        uptime_s: { type: integer }
        postgres:
          $ref: "#/components/schemas/HealthCheck"
        redis:
          $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      properties:
        ok: { type: boolean }
        error: { type: string }
        latency_ms: { type: integer }

    OTPRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string
          description: E.164 Indian mobile number
          pattern: "^[+]91[6-9][0-9]{9}$"
          example: "+91987654210"

    OTPVerify:
      type: object
      required: [phone, code, age_confirmed]
      properties:
        phone: { type: string, example: "+91987654210" }
        code: { type: string, minLength: 6, maxLength: 6, example: "123456" }
        age_confirmed:
          type: boolean
          description: 18+ age gate (DPDP)

    Session:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            role: { type: string, enum: [rider, driver, both, admin] }

    Waypoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, example: 12.9352 }
        lng: { type: number, example: 77.6245 }

    PublishRouteRequest:
      type: object
      required: [vehicle_id, origin_label, dest_label, waypoints, departure_time, weekday_mask, duration_min, seats]
      properties:
        vehicle_id: { type: string, format: uuid }
        origin_label: { type: string, example: Koramangala }
        dest_label: { type: string, example: Whitefield }
        waypoints:
          type: array
          minItems: 2
          items: { $ref: "#/components/schemas/Waypoint" }
        departure_time: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "08:30" }
        weekday_mask:
          type: integer
          minimum: 0
          maximum: 127
          description: Bit0=Monday … bit6=Sunday
        duration_min: { type: integer, minimum: 1 }
        seats: { type: integer, minimum: 1, maximum: 11 }
        price_estimate: { type: number, minimum: 0 }

    Route:
      type: object
      properties:
        id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        vehicle_id: { type: string, format: uuid }
        origin_label: { type: string }
        dest_label: { type: string }
        waypoints:
          type: array
          items: { $ref: "#/components/schemas/Waypoint" }
        departure_time: { type: string, example: "08:30" }
        weekday_mask: { type: integer }
        duration_min: { type: integer }
        distance_km: { type: number }
        seats: { type: integer }
        price_estimate: { type: number }
        status: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }

    SearchRequest:
      type: object
      required: [pickup_lat, pickup_lng, drop_lat, drop_lng, date]
      properties:
        pickup_lat: { type: number, example: 12.9352 }
        pickup_lng: { type: number, example: 77.6245 }
        drop_lat: { type: number, example: 12.9698 }
        drop_lng: { type: number, example: 77.7500 }
        date: { type: string, format: date, example: "2026-09-28" }
        time: { type: string, description: preferred departure HH:MM (default 09:00) }
        seats: { type: integer, default: 1, minimum: 1, maximum: 11 }
        radius_m: { type: number, default: 2000, maximum: 10000 }
        city: { type: string, description: ranking weight override lookup }

    ScoreParts:
      type: object
      properties:
        detour: { type: number }
        time: { type: number }
        rating: { type: number }
        price: { type: number }

    Ride:
      type: object
      properties:
        ride_instance_id: { type: string, format: uuid }
        route_id: { type: string, format: uuid }
        driver_id: { type: string, format: uuid }
        driver_rating: { type: number }
        origin_label: { type: string }
        dest_label: { type: string }
        departure_time: { type: string, example: "08:30" }
        duration_min: { type: integer }
        distance_km: { type: number }
        seats_free: { type: integer }
        fare: { type: number, description: per-seat fare after mandatory cost-cap clamp }
        total: { type: number, description: "fare + fees + GST, per seat" }
        detour_km: { type: number }
        detour_min: { type: number }
        price_estimate: { type: number }
        score: { type: number, minimum: 0, maximum: 1 }
        score_parts: { $ref: "#/components/schemas/ScoreParts" }

    SearchResponse:
      type: object
      required: [results, count, weights, radius_m]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/Ride" }
        count: { type: integer }
        weights: { $ref: "#/components/schemas/ScoreParts" }
        radius_m: { type: number }

    CreateBookingRequest:
      type: object
      required: [ride_instance_id, seats]
      properties:
        ride_instance_id: { type: string, format: uuid }
        seats: { type: integer, minimum: 1, maximum: 11 }

    PaymentIntent:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [CREATED, CAPTURED, FAILED, REFUNDED] }
        provider: { type: string, example: upi }

    Booking:
      type: object
      properties:
        id: { type: string, format: uuid }
        ride_instance_id: { type: string, format: uuid }
        passenger_id: { type: string, format: uuid }
        seats: { type: integer }
        status:
          type: string
          enum: [PENDING_PAYMENT, CONFIRMED, CANCELLED, COMPLETED, EXPIRED]
        fare: { type: number }
        total: { type: number }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
        payment: { $ref: "#/components/schemas/PaymentIntent" }

    PaymentStatus:
      type: object
      properties:
        id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        amount: { type: number }
        status: { type: string, enum: [CREATED, CAPTURED, FAILED, REFUNDED] }

    PaymentEvent:
      type: object
      required: [event_id, type, booking_id]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, enum: [payment.captured, payment.failed, payment.refunded] }
        booking_id: { type: string, format: uuid }
        amount: { type: number }
        provider_ref: { type: string }
        ts: { type: integer, description: unix seconds }

    VerifyStatus:
      type: object
      properties:
        state:
          type: string
          enum:
            - NOT_STARTED
            - CONSENTED
            - REDIRECTED
            - DOCS_FETCHED
            - FACE_MATCHED
            - VERIFIED
            - FAILED
        doc_type: { type: string, enum: [DL, RC, AADHAAR] }
        masked_fields:
          type: object
          additionalProperties: { type: string }
          description: masked document fields only — raw numbers are never stored
        face_match_score: { type: number, minimum: 0, maximum: 1 }
        consent_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        authorize_url: { type: string }
        auth_state: { type: string, description: PKCE state (start response only) }
